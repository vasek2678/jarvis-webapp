<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Джарвис Web OS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0f0f0f);
            --text: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
            --accent: var(--tg-theme-button-color, #0a84ff);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
        
        /* Шапка */
        .header { padding: 20px; text-align: center; background: var(--card-bg); border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; }
        
        /* Контейнеры вкладок */
        .tab-content { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Элементы UI */
        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        h3 { margin-bottom: 15px; font-size: 18px; }
        button { background: var(--accent); color: #fff; border: none; padding: 14px 20px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 10px; transition: 0.2s; }
        button:active { transform: scale(0.97); opacity: 0.8; }
        select, textarea, input { width: 100%; padding: 12px; background: var(--bg); color: var(--text); border: 1px solid #444; border-radius: 10px; margin-bottom: 15px; font-size: 16px; }
        textarea { resize: vertical; min-height: 100px; }

        /* Чат с ИИ */
        .chat-box { height: 350px; overflow-y: auto; background: var(--bg); border-radius: 10px; padding: 10px; margin-bottom: 15px; border: 1px solid #333; }
        .msg { padding: 10px 14px; border-radius: 14px; margin-bottom: 10px; max-width: 85%; line-height: 1.4; }
        .msg.user { background: var(--accent); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
        .msg.ai { background: var(--card-bg); border: 1px solid #444; margin-right: auto; border-bottom-left-radius: 4px; }
        .chat-input-row { display: flex; gap: 10px; }
        .chat-input-row input { margin-bottom: 0; }
        .chat-input-row button { width: auto; margin-bottom: 0; padding: 0 20px; }

        /* Нижнее меню (Навигация) */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; z-index: 100; }
        .nav-item { color: #888; text-align: center; font-size: 12px; cursor: pointer; width: 33%; padding: 5px; transition: 0.2s; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .nav-icon { font-size: 24px; margin-bottom: 3px; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="userName">Джарвис OS</h2>
    </div>

    <!-- ВКЛАДКА 1: ЧАТ С ИИ -->
    <div id="tab-chat" class="tab-content active">
        <div class="card">
            <h3>Встроенный ИИ</h3>
            <div class="chat-box" id="chatBox">
                <div class="msg ai">Привет! Я Джарвис. О чем пообщаемся прямо здесь?</div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="aiInput" placeholder="Напиши сообщение...">
                <button onclick="sendToAI()">➤</button>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА 2: РАСПИСАНИЕ -->
    <div id="tab-schedule" class="tab-content">
        <div class="card">
            <h3>Изменить расписание</h3>
            <label>Выбери день:</label>
            <select id="schDay">
                <option value="0">Понедельник</option>
                <option value="1">Вторник</option>
                <option value="2">Среда</option>
                <option value="3">Четверг</option>
                <option value="4">Пятница</option>
                <option value="5">Суббота</option>
            </select>
            
            <label>Уроки (каждый с новой строки):</label>
            <textarea id="schLessons" placeholder="1. Алгебра&#10;2. Физика..."></textarea>
            
            <label>Допы / Тренировки:</label>
            <input type="text" id="schExtra" placeholder="Например: Репетитор в 18:00">
            
            <button onclick="saveSchedule()">💾 Сохранить и закрыть</button>
        </div>
    </div>

    <!-- ВКЛАДКА 3: БЫСТРЫЕ ДЕЙСТВИЯ -->
    <div id="tab-tools" class="tab-content">
        <div class="card">
            <h3>Трекеры</h3>
            <button onclick="sendActionToBot('water')">💧 Выпил стакан воды</button>
            <button style="background: #8b5a2b;" onclick="sendActionToBot('coffee')">☕️ Выпил кофе</button>
        </div>
        <div class="card">
            <h3>Финансы</h3>
            <input type="number" id="spendAmount" placeholder="Сумма (например: 150)">
            <input type="text" id="spendDesc" placeholder="На что? (например: Обед)">
            <button style="background: #28a745;" onclick="saveSpend()">💸 Записать трату</button>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('chat', this)">
            <span class="nav-icon">💬</span> ИИ Чат
        </div>
        <div class="nav-item" onclick="switchTab('schedule', this)">
            <span class="nav-icon">📅</span> Расписание
        </div>
        <div class="nav-item" onclick="switchTab('tools', this)">
            <span class="nav-icon">⚙️</span> Панель
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe?.user) document.getElementById('userName').innerText = `Система ${tg.initDataUnsafe.user.first_name}`;

        // Навигация по вкладкам
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        // ВСТАВЬ СЮДА СВОЙ КЛЮЧ GEMINI ДЛЯ ЧАТА НА САЙТЕ
        const GEMINI_KEY = "ВСТАВЬ_КЛЮЧ_СЮДА"; 

        // Логика встроенного ИИ (работает без закрытия сайта)
        async function sendToAI() {
            const inputField = document.getElementById('aiInput');
            const text = inputField.value.trim();
            if (!text) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                
                chatBox.innerHTML += `<div class="msg ai">${aiText}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `<div class="msg ai">❌ Ошибка связи с API Гугла. Проверь ключ в HTML-коде.</div>`;
            }
        }

        // Логика передачи данных в Питон-бота
        function sendActionToBot(actionType) {
            // Формируем красивый JSON и отправляем в ТГ
            const data = { action: actionType };
            tg.sendData(JSON.stringify(data)); 
            tg.close();
        }

        function saveSchedule() {
            const day = document.getElementById('schDay').value;
            const lessons = document.getElementById('schLessons').value;
            const extra = document.getElementById('schExtra').value;
            
            const data = { action: 'update_schedule', day: day, lessons: lessons, extra: extra };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }

        function saveSpend() {
            const amt = document.getElementById('spendAmount').value;
            const desc = document.getElementById('spendDesc').value;
            if(!amt || !desc) return alert("Заполни сумму и описание!");
            
            const data = { action: 'add_spend', amount: amt, desc: desc };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
